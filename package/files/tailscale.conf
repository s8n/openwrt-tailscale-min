config settings 'settings'
	option log_stderr '1'
	option log_stdout '1'
	option port '41641'
	option state_file '/etc/tailscale/tailscaled.state'
	option fw_mode 'nftables'
	# Where the daemon is unpacked to at start (RAM-backed).
	option daemon_path '/tmp/tailscaled'
	# Where the `tailscale` wrapper downloads the CLI to (RAM-backed).
	option cli_path '/tmp/tailscale-cli'
	# Override where the CLI is downloaded from. The default is baked into
	# /usr/sbin/tailscale at build time.
	#option cli_url 'http://192.168.1.2:8000/tailscale-cli'
	# Expected sha256 of the downloaded CLI. Defaults to the checksum of the
	# CLI built alongside this package; set to 'none' to skip verification.
	#option cli_sha256 'none'
